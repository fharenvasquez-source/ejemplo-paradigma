<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta · Tienda Deportiva</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="encabezado">
    <div class="encabezado__contenido">
      <h1 class="encabezado__logo">🏅 Tienda Deportiva</h1>
      <nav class="encabezado__nav">
        <a href="index.html">Catálogo</a>
        <a href="carrito.html">Carrito</a>
        <a href="mis-facturas.html">Mis facturas</a>
        <a href="login.html" id="enlace-sesion">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="contenido contenido--angosto">
    <section class="tarjeta-formulario">
      <h2>Crear cuenta</h2>
      <p class="texto-suave">Regístrate para comprar en la tienda.</p>

      <form id="form-registro">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required autocomplete="email" />

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required placeholder="9999-9999" />

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" required />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="6" autocomplete="new-password" />

        <p id="mensaje-registro" class="mensaje-formulario oculto"></p>

        <button type="submit" class="boton boton--primario boton--ancho">Crear cuenta</button>
      </form>

      <p class="texto-suave texto-centrado">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </section>
  </main>

  <footer class="pie">
    <p>Proyecto PHP - Python - JavaScript · Paradigmas de Programación · 2026</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
