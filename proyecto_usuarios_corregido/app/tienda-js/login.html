<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Tienda Deportiva</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="encabezado">
    <div class="encabezado__contenido">
      <h1 class="encabezado__logo">🏅 Tienda Deportiva</h1>
      <nav class="encabezado__nav">
        <a href="index.html">Catálogo</a>
        <a href="carrito.html">Carrito</a>
        <a href="mis-facturas.html">Mis facturas</a>
        <a href="login.html" id="enlace-sesion" class="activo">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="contenido contenido--angosto">
    <section class="tarjeta-formulario">
      <h2>Iniciar sesión</h2>
      <p class="texto-suave">Ingresa con tu correo y contraseña de cliente.</p>

      <form id="form-login">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required autocomplete="email" />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password" />

        <p id="mensaje-login" class="mensaje-formulario oculto"></p>

        <button type="submit" class="boton boton--primario boton--ancho">Entrar</button>
      </form>

      <p class="texto-suave texto-centrado">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <footer class="pie">
    <p>Proyecto PHP - Python - JavaScript · Paradigmas de Programación · 2026</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
